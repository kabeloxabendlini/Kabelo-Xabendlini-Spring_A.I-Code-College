plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', "1.0.3")
}

dependencies {
    // Spring Boot web application
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring AI OpenAI integration
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // Spring AOP support for Spring Retry's proxy-based retry mechanism
    runtimeOnly 'org.springframework.boot:spring-boot-starter-aop'

    // Testing dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // WireMock for testing without making real OpenAI API calls
    testImplementation 'org.wiremock.integrations:wiremock-spring-boot:3.9.0'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

