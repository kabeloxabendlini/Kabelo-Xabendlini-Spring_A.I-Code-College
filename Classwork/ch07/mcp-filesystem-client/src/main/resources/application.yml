spring:
  application:
    name: mcp-filesystem-client

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: "qwen2.5:3b"

    mcp:
      client:
        stdio:
          connections:
            filesystem:
              command: 'cmd.exe'
              args:
                - '/c'
                - 'npx'
                - '-y'
                - '@modelcontextprotocol/server-filesystem'
                - 'C:\mcp-playground'

        toolcallback:
          enabled: true
